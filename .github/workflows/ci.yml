# Comprueba cada push y cada pull request: tipos, tests y compilación de la interfaz.
# Si algo falla, GitHub lo marca en rojo antes de que Railway despliegue la rama main.
name: CI
on:
  push:
  pull_request:
jobs:
  comprobar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
